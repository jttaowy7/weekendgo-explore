<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>周末城市探索指南 · 不知道去哪玩？让周末自己长出来</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 导航 -->
<nav class="nav">
  <div class="wrap">
    <a class="logo" href="index.html"><span class="dot">🧭</span>WeekendGo</a>
    <div class="links">
      <a class="active" href="index.html">首页</a>
      <a href="explore.html">探索</a>
      <a href="teamup.html">组队</a>
      <a href="profile.html">我的</a>
    </div>
    <a class="me" href="profile.html" title="个人主页">🙋</a>
  </div>
</nav>

<div class="wrap">
  <!-- Hero -->
  <section class="hero">
    <h1>周末别躺平，<span class="hl" id="hello">去探索这座城市</span></h1>
    <p>一站式聚合本地展览 / 市集 / 演出 / 徒步，结合天气与你的偏好，把「去哪玩」变成 3 秒决定。</p>

    <div class="weather-card" id="weatherCard"></div>
  </section>

  <!-- 偏好速调 -->
  <div class="section-head">
    <h2>🎯 我的偏好</h2>
    <span class="sub">点一下立即重新推荐</span>
    <a class="more" href="prefs.html">完整设置 →</a>
  </div>
  <div class="chips" id="prefChips"></div>

  <!-- 推荐 -->
  <div class="section-head">
    <h2>🔥 为你推荐</h2>
    <span class="sub" id="recSub"></span>
    <a class="more" href="explore.html">看全部 →</a>
  </div>
  <div class="grid" id="recGrid"></div>

  <footer>WeekendGo · 大学生周末探索指南 MVP ｜ 数据为演示用途，真实部署接入本地活动/天气接口即可</footer>
</div>

<!-- 首次引导弹窗 -->
<div class="overlay hidden" id="onboard">
  <div class="modal" id="onboardModal"></div>
</div>
<div class="toast"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
/* ---------- 首页逻辑 ---------- */
const wEl = document.getElementById("weatherCard");
function refreshHome() {
  const prefs = App.getPrefs();
  const weather = App.getWeather();
  const ranked = App.recommend(ACTIVITIES, prefs, weather).slice(0, 6);
  const fitOf = (a) => App.weatherFitText(a, weather);
  App.renderGrid(document.getElementById("recGrid"), ranked, {
    score: (a) => a.score,
    reason: (a) => fitOf(a).text,
    fitOk: (a) => fitOf(a).ok,
  });
  document.getElementById("recSub").textContent =
    `${App.CITY} · ${weather.label} · 共 ${ranked.length} 个高匹配活动`;
}

/* 偏好速调 chips */
function renderPrefChips() {
  const prefs = App.getPrefs();
  const el = document.getElementById("prefChips");
  el.innerHTML = App.ACTIVITY_TYPES.map(t => {
    const on = prefs.types.includes(t.key);
    return `<button class="chip ${on ? 'on' : ''}" data-t="${t.key}">${t.emoji} ${t.name}</button>`;
  }).join("") +
  `<button class="chip" data-edit style="background:#fff;border-style:dashed">⚙️ 预算/距离/人数</button>`;
  el.querySelectorAll("[data-t]").forEach(b => b.addEventListener("click", () => {
    const prefs = App.getPrefs();
    const k = b.dataset.t;
    prefs.types.includes(k) ? prefs.types = prefs.types.filter(x => x !== k) : prefs.types.push(k);
    App.setPrefs(prefs); b.classList.toggle("on");
    App.toast("偏好已更新，重新推荐中…"); refreshHome();
  }));
  el.querySelector("[data-edit]").addEventListener("click", () => location.href = "prefs.html");
}

/* 引导弹窗（首次访问） */
function startOnboard() {
  const seen = App.get(STORAGE_KEYS.onboarded, false);
  if (seen) return;
  const steps = [
    { t: "欢迎来到 WeekendGo 👋", l: "先花 20 秒告诉我你的兴趣，周末就交给我来安排。",
      field: `<div class="field"><label>你对哪些活动感兴趣？（可多选）</label><div class="chips" id="obTypes"></div></div>` },
    { t: "预算 & 距离 💰", l: "大学生预算有限，我懂。设定上限，超出的我会标出来。",
      field: `<div class="field"><label>单场可接受票价上限</label>
        <select id="obBudget"><option value="0">不限（土豪随意）</option><option value="30">¥30 以内</option><option value="50" selected>¥50 以内</option><option value="100">¥100 以内</option></select></div>
        <div class="field"><label>可接受出行距离</label>
        <select id="obDist"><option value="8">8km 内（就近）</option><option value="15" selected>15km 内</option><option value="30">30km 内</option></select></div>` },
    { t: "约谁一起？ 👯", l: "一个人也行，一群人也行。我会据此推荐合适规模的活动。",
      field: `<div class="field"><label>偏好同行人数</label>
        <div class="seg" id="obPpl" style="display:inline-flex">
          ${[1,2,3,4,6].map(n=>`<button data-p="${n}" class="${n===2?'on':''}">${n===6?'6+':n}人</button>`).join("")}
        </div></div>` },
  ];
  let idx = 0;
  const box = document.getElementById("onboardModal");
  function paint() {
    const s = steps[idx];
    box.innerHTML = `
      <div class="step-dots">${steps.map((_,i)=>`<i class="${i===idx?'on':''}"></i>`).join("")}</div>
      <h2>${s.t}</h2><p class="lead">${s.l}</p>${s.field}
      <div class="row">
        ${idx>0?'<button class="btn btn-ghost" id="obPrev">上一步</button>':''}
        <button class="btn btn-primary" id="obNext">${idx<steps.length-1?'下一步 →':'🎉 开始探索'}</button>
      </div>`;
    if (idx === 0) {
      const ts = box.querySelector("#obTypes");
      ts.innerHTML = App.ACTIVITY_TYPES.map(t=>`<button class="chip on" data-t="${t.key}">${t.emoji} ${t.name}</button>`).join("");
      ts.querySelectorAll("[data-t]").forEach(b=>b.addEventListener("click",()=>b.classList.toggle("on")));
    }
    if (idx === 2) box.querySelectorAll("#obPpl button").forEach(b=>b.addEventListener("click",()=>{
      box.querySelectorAll("#obPpl button").forEach(x=>x.classList.remove("on")); b.classList.add("on");
    }));
    box.querySelector("#obNext").addEventListener("click", () => {
      if (idx < steps.length - 1) { idx++; paint(); }
      else finishOnboard();
    });
    const prev = box.querySelector("#obPrev"); if (prev) prev.addEventListener("click", () => { idx--; paint(); });
  }
  function finishOnboard() {
    const types = [...box.querySelectorAll("#obTypes .chip.on")].map(c => c.dataset.t);
    const ppl = +(box.querySelector("#obPpl .on")?.dataset.p || 2);
    const prefs = Object.assign(App.defaultPrefs(), {
      types: types.length ? types : App.defaultPrefs().types,
      budget: +(document.getElementById("obBudget")?.value || 50),
      distance: +(document.getElementById("obDist")?.value || 15),
      people: ppl,
    });
    App.setPrefs(prefs); App.set(STORAGE_KEYS.onboarded, true);
    document.getElementById("onboard").classList.add("hidden");
    App.toast("偏好已保存，开始为你推荐 🎯");
    renderPrefChips(); refreshHome();
  }
  document.getElementById("onboard").classList.remove("hidden");
  paint();
}

/* init */
App.bindRipple();
App.renderWeather(wEl, refreshHome);
renderPrefChips();
refreshHome();
startOnboard();
</script>
</body>
</html>
