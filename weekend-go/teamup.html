<script>
const listEl=document.getElementById("teamList");

function render(){
  const ft=document.getElementById("filterType").value;
  let teams=App.getTeams();
  if(ft) teams=teams.filter(t=>{const a=ACTIVITIES.find(x=>x.id===t.actId);return a&&a.type===ft;});
  if(!teams.length){listEl.innerHTML=`<div class="empty"><div class="e-emoji">🫥</div><p>该类型还没有组队帖，来当第一个吧！</p></div>`;return;}
  listEl.innerHTML=teams.map(t=>{
    const a=ACTIVITIES.find(x=>x.id===t.actId)||{title:"（已下架活动）",emoji:"📌",cover:"#ccc",type:"",id:""};
    const filled=Math.min(t.people,t.total);
    const dots=Array.from({length:t.total},(_,i)=>`<i class="${i<filled?'f':''}"></i>`).join("");
    return `
    <div class="team-card">
      <div class="badge" style="background:${a.cover}">${a.emoji}</div>
      <div class="tc-body">
        <h4>${a.title}</h4>
        <div class="note">${t.note}</div>
        <div class="people-bar">${dots}</div>
        <div class="meta"><span>👤 ${t.user}</span><span>🕒 ${t.time}</span><span>📞 ${t.contact}</span></div>
      </div>
      <a class="btn btn-ghost" href="detail.html?id=${a.id}">查看活动 →</a>
    </div>`;
  }).join("");
}
document.getElementById("filterType").addEventListener("change",render);

document.getElementById("postOpen").addEventListener("click",()=>{
  const box=document.getElementById("postBox");
  box.innerHTML=`
    <h2>👯 发布组队</h2><p class="lead">从本周活动中选一场，告诉大伙你缺几个人。</p>
    <div class="field"><label>选择活动</label>
      <select id="pAct" style="width:100%;padding:10px;border-radius:12px;border:1px solid var(--line)">
        ${ACTIVITIES.map(a=>`<option value="${a.id}">${a.emoji} ${a.title}</option>`).join("")}
      </select></div>
    <div class="field"><label>已有 / 总人数</label>
      <div style="display:flex;gap:10px"><select id="pHave"><option>1</option><option>2</option><option>3</option></select>
      <span style="align-self:center">/</span>
      <select id="pTotal"><option>2</option><option selected>4</option><option>6</option><option>8</option></select></div></div>
    <div class="field"><label>留言</label>
      <textarea id="pNote" rows="3" style="width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;font-family:inherit;font-size:14px" placeholder="比如：周六一起去，女生优先 / 可拼车 / AA 门票"></textarea></div>
    <div class="field"><label>联系方式</label>
      <input id="pContact" style="width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:14px" placeholder="微信 / 留言区扣1"></div>
    <div class="row"><button class="btn btn-primary" id="pSend">发布</button></div>`;
  document.getElementById("pSend").addEventListener("click",()=>{
    const act=ACTIVITIES.find(a=>a.id===document.getElementById("pAct").value);
    App.addTeam({id:"t"+Date.now(),actId:act.id,user:"我",people:+document.getElementById("pHave").value,
      total:+document.getElementById("pTotal").value,note:document.getElementById("pNote").value||"（没写留言）",
      contact:document.getElementById("pContact").value||"评论区扣1",time:act.date});
    document.getElementById("postModal").classList.add("hidden");
    App.confetti(window.innerWidth/2,window.innerHeight/2);
    App.toast("组队已发布 🎉"); render();
  });
  document.getElementById("postModal").classList.remove("hidden");
});
document.getElementById("postModal").addEventListener("click",e=>{if(e.target.id==="postModal")e.currentTarget.classList.add("hidden");});

App.bindRipple(); render();
</script>
